# libcamera crashes PipeWire with this camera (OV08X40 binned mode is broken).
# The camera is provided instead as the "Integrated Camera" v4l2loopback
# device by v4l2-relayd (see /etc/v4l2-relayd.d/integrated-camera.conf).
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

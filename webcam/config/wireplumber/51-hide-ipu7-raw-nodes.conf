# The raw Intel IPU7 capture nodes only give a black picture. Hide them so
# apps only see the working "Integrated Camera" (v4l2-relayd) device.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "isys" } ]
    actions = { update-props = { device.disabled = true, node.disabled = true } }
  }
]

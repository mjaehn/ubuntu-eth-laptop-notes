# The pipeline scales on the GPU (vapostproc). GStreamer only offers that
# element if the GPU render node exists when the service starts, and at boot
# the service used to start just before the graphics driver was ready.
# ($$ is systemd's escape for a literal $.)
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 120 ] && ! ls /dev/dri/renderD* >/dev/null 2>&1; do sleep 0.5; i=$$((i+1)); done; sleep 1'
